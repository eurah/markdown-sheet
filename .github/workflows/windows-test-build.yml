name: Windows test build

on:
  workflow_dispatch:
  push:
    branches: ['codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: markdown-sheet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: markdown-sheet/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Front matter regression tests
        run: node --test tests/frontMatter.test.mjs
      - name: Align Rust Tauri with JavaScript API
        run: cargo update --manifest-path src-tauri/Cargo.toml -p tauri --precise 2.11.0
      - name: Save resolved Rust dependencies
        uses: actions/upload-artifact@v4
        with:
          name: rust-lockfile
          path: markdown-sheet/src-tauri/Cargo.lock
          if-no-files-found: error
      - name: Build Windows application
        run: npm run tauri build -- --no-bundle
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Upload portable application and test guide
        uses: actions/upload-artifact@v4
        with:
          name: markdown-studio-windows-${{ github.sha }}
          path: |
            markdown-sheet/src-tauri/target/release/markdown-sheet.exe
            tests/manual/front-matter.md
            tests/manual/windows-checklist.md
          if-no-files-found: error
          retention-days: 14
